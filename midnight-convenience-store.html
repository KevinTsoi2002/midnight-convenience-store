<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1718">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%230d1718'/%3E%3Cpath d='M12 18h40v8H12zM18 31h28v21H18z' fill='%23b8d65a'/%3E%3C/svg%3E">
  <title>凌晨 2:17 的便利店</title>
  <style>
    :root {
      --ink: #0d1718;
      --ink-soft: #101f20;
      --panel: #16292a;
      --panel-raised: #1f3533;
      --panel-light: #29423e;
      --lime: #b8d65a;
      --lime-soft: #d7e3a2;
      --cream: #e9f4dd;
      --muted: #8fa9a0;
      --line: rgba(233, 244, 221, 0.18);
      --coral: #ed7657;
      --blue: #7cb8a5;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
      --radius: 8px;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--ink); }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--cream);
      background: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    button {
      font: inherit;
      color: inherit;
    }

    button:focus-visible {
      outline: 2px solid var(--lime-soft);
      outline-offset: 3px;
    }

    [hidden] { display: none !important; }

    .app-shell {
      width: min(1440px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px;
      overflow: hidden;
      background: var(--ink);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 46px;
      padding: 0 2px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--lime-soft);
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .topbar-meta {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .topbar-clock {
      color: var(--cream);
      font-weight: 700;
      letter-spacing: .2em;
    }

    .audio-button,
    .text-button {
      border: 0;
      padding: 7px 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color .2s var(--ease);
    }

    .audio-button:hover,
    .audio-button[aria-pressed="true"],
    .text-button:hover {
      color: var(--lime);
    }

    .intro-screen {
      min-height: calc(100vh - 36px);
      display: grid;
      grid-template-columns: minmax(0, .88fr) minmax(420px, 1.12fr);
      align-items: center;
      gap: 7vw;
      padding: clamp(28px, 8vw, 112px) clamp(10px, 4vw, 56px);
    }

    .intro-copy-wrap { max-width: 590px; }

    .eyebrow,
    .section-kicker,
    .customer-index {
      margin: 0 0 18px;
      color: var(--lime);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      max-width: 620px;
      margin-bottom: 22px;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 72px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: .96;
    }

    .intro-copy {
      max-width: 390px;
      margin-bottom: 34px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .primary-button {
      min-height: 48px;
      border: 1px solid var(--lime);
      border-radius: var(--radius);
      padding: 0 22px;
      background: var(--lime);
      color: var(--ink);
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .05em;
      transition: background .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
    }

    .primary-button:hover {
      background: var(--lime-soft);
      box-shadow: 0 8px 25px rgba(184, 214, 90, .16);
      transform: translateY(-2px);
    }

    .primary-button:disabled {
      border-color: var(--line);
      background: var(--panel-raised);
      color: #647b72;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .intro-note {
      margin: 16px 0 0;
      color: #5f7770;
      font-size: 12px;
    }

    .store-preview {
      position: relative;
      min-height: 430px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .store-preview::before,
    .store-stage::before {
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(90deg, transparent 0 12%, rgba(184, 214, 90, .05) 12% 13%, transparent 13% 87%, rgba(184, 214, 90, .04) 87% 88%, transparent 88%),
        linear-gradient(180deg, rgba(22, 41, 42, .1), rgba(8, 16, 17, .75));
      content: "";
    }

    .preview-sign {
      display: flex;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--lime);
      color: var(--ink);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
    }

    .preview-window {
      position: absolute;
      inset: 82px 15% 78px;
      border: 1px solid #58736b;
      background:
        repeating-linear-gradient(106deg, transparent 0 26px, rgba(185, 217, 231, .18) 27px 28px),
        linear-gradient(180deg, #162f30, #0d1718);
      overflow: hidden;
    }

    .preview-window::after {
      position: absolute;
      left: 14%;
      right: 14%;
      bottom: 24px;
      height: 2px;
      background: var(--coral);
      box-shadow: 0 0 22px rgba(237, 118, 87, .8);
      content: "";
    }

    .preview-shelf {
      position: absolute;
      left: 12%;
      right: 12%;
      height: 62px;
      border: 1px solid #3b5a52;
      background: rgba(24, 54, 51, .75);
    }

    .preview-shelf.one { top: 38px; }
    .preview-shelf.two { top: 132px; }

    .preview-product {
      position: absolute;
      top: 15px;
      width: 16px;
      height: 34px;
      border-radius: 2px 2px 4px 4px;
      background: var(--coral);
      box-shadow: 30px 0 var(--lime-soft), 60px 0 var(--blue), 90px 0 #e6c85c;
    }

    .preview-shelf .preview-product { left: 17%; }
    .preview-caption {
      position: absolute;
      bottom: 18px;
      left: 8%;
      color: var(--lime-soft);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
    }

    .game-screen { min-height: calc(100vh - 36px); }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(340px, .65fr);
      gap: 18px;
      padding-top: 18px;
    }

    .store-stage {
      position: relative;
      min-height: 460px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #102121;
      isolation: isolate;
    }

    .store-stage::after {
      position: absolute;
      inset: 0;
      z-index: -1;
      background: repeating-linear-gradient(108deg, transparent 0 24px, rgba(184, 214, 90, .035) 25px 26px);
      content: "";
      opacity: .7;
    }

    .stage-sign {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 18px;
      background: var(--lime);
      color: var(--ink);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .stage-sign span:last-child { letter-spacing: .18em; }

    .stage-window {
      position: absolute;
      top: 86px;
      right: 10%;
      left: 10%;
      height: 158px;
      border: 1px solid #45665d;
      background:
        repeating-linear-gradient(106deg, transparent 0 24px, rgba(185, 217, 231, .15) 25px 26px),
        linear-gradient(180deg, #1d3a3d, #0d1a1c);
      overflow: hidden;
    }

    .window-line {
      position: absolute;
      right: 9%;
      bottom: 18px;
      left: 9%;
      height: 2px;
      background: var(--coral);
      box-shadow: 0 0 24px rgba(237, 118, 87, .7);
    }

    .shelf {
      position: absolute;
      right: 10%;
      left: 10%;
      height: 68px;
      border: 1px solid #3b5a52;
      background: rgba(22, 48, 46, .82);
    }

    .shelf.first { top: 277px; }
    .shelf.second { top: 360px; }

    .shelf::after {
      position: absolute;
      right: 0;
      bottom: -5px;
      left: 0;
      height: 4px;
      background: rgba(184, 214, 90, .25);
      content: "";
    }

    .shelf-items {
      display: flex;
      align-items: center;
      gap: 22px;
      height: 100%;
      padding: 0 10%;
    }

    .bottle,
    .box,
    .can {
      display: inline-block;
      flex: 0 0 auto;
      width: 18px;
      height: 38px;
      border-radius: 3px 3px 5px 5px;
      background: var(--lime-soft);
      box-shadow: 18px 5px 0 -2px var(--coral), 36px -2px 0 -3px var(--blue), 56px 2px 0 -1px #e6c85c;
      opacity: .78;
    }

    .box { height: 28px; border-radius: 2px; }
    .can { width: 22px; height: 30px; border-radius: 50%; }

    .counter {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 36px;
      background: #1e3531;
      border-top: 1px solid #48635b;
    }

    .scene-person {
      position: absolute;
      right: 19%;
      bottom: 32px;
      width: 84px;
      height: 148px;
      transition: transform .35s var(--ease), filter .35s var(--ease);
    }

    .scene-person.is-warm { filter: drop-shadow(0 0 14px rgba(184, 214, 90, .3)); }
    .scene-person.is-light { filter: drop-shadow(0 0 15px rgba(237, 118, 87, .34)); }
    .scene-person.is-company { filter: drop-shadow(0 0 15px rgba(124, 184, 165, .28)); }

    .person-head {
      position: absolute;
      top: 0;
      left: 26px;
      width: 34px;
      height: 38px;
      border-radius: 50%;
      background: #d6b99e;
      box-shadow: 0 -4px 0 4px #152728;
    }

    .person-body {
      position: absolute;
      top: 35px;
      left: 13px;
      width: 60px;
      height: 92px;
      border-radius: 24px 24px 8px 8px;
      background: #263c3a;
      border: 1px solid #54726a;
    }

    .person-bag {
      position: absolute;
      right: 0;
      bottom: 2px;
      width: 29px;
      height: 36px;
      border: 2px solid var(--lime-soft);
      background: #233b37;
      transform: rotate(6deg);
    }

    .scene-caption {
      position: absolute;
      bottom: 54px;
      left: 18px;
      max-width: 48%;
      color: var(--lime-soft);
      font-size: 12px;
      letter-spacing: .03em;
    }

    .customer-panel,
    .receipt-panel {
      border: 1px solid var(--line);
      background: rgba(22, 41, 42, .82);
    }

    .customer-panel {
      min-height: 460px;
      padding: 28px;
    }

    .customer-panel h2 {
      margin-bottom: 2px;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 38px;
      font-weight: 400;
      line-height: 1;
    }

    .customer-role {
      margin-bottom: 38px;
      color: var(--muted);
      font-size: 13px;
    }

    blockquote {
      margin: 0 0 24px;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      line-height: 1.35;
    }

    .customer-hint {
      max-width: 280px;
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 13px;
    }

    .feedback {
      margin: 24px 0 20px;
      padding: 14px 16px;
      border-left: 2px solid var(--coral);
      background: rgba(237, 118, 87, .08);
      color: var(--lime-soft);
      font-size: 14px;
      line-height: 1.65;
      animation: reveal .35s var(--ease);
    }

    .feedback::before {
      display: block;
      margin-bottom: 7px;
      color: var(--coral);
      content: "顾客的回声";
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .game-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 26px;
    }

    .helper-text {
      color: var(--muted);
      font-size: 12px;
    }

    .inventory {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(230px, .35fr);
      gap: 18px;
      margin-top: 18px;
    }

    .inventory-section { min-width: 0; }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 0 0 9px;
      color: var(--cream);
    }

    .section-heading h3 {
      margin: 0;
      color: var(--cream);
      font-size: 14px;
      font-weight: 700;
    }

    .section-heading span {
      color: var(--muted);
      font-size: 12px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .product-card {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 66px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 9px 11px;
      background: rgba(22, 41, 42, .7);
      color: var(--cream);
      cursor: pointer;
      text-align: left;
      transition: border-color .18s var(--ease), background .18s var(--ease), transform .18s var(--ease);
    }

    .product-card:hover {
      border-color: #638274;
      background: var(--panel-raised);
      transform: translateY(-1px);
    }

    .product-card.is-selected {
      border-color: var(--lime);
      background: rgba(184, 214, 90, .12);
      box-shadow: inset 3px 0 var(--lime);
    }

    .product-card:disabled {
      cursor: not-allowed;
      opacity: .45;
      transform: none;
    }

    .product-icon {
      display: grid;
      flex: 0 0 30px;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid rgba(233, 244, 221, .24);
      border-radius: 5px;
      background: #1f3734;
      color: var(--lime-soft);
      font-size: 15px;
    }

    .product-card.is-selected .product-icon {
      border-color: var(--lime);
      background: var(--lime);
      color: var(--ink);
    }

    .product-name {
      overflow: hidden;
      color: var(--cream);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bag {
      min-height: 176px;
      border: 1px solid var(--line);
      padding: 14px;
      background: rgba(22, 41, 42, .7);
    }

    .bag.empty { color: #688078; }

    .bag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .bag-item {
      border: 1px solid rgba(184, 214, 90, .45);
      border-radius: 4px;
      padding: 5px 7px;
      background: rgba(184, 214, 90, .1);
      color: var(--lime-soft);
      font-size: 12px;
    }

    .receipt-panel {
      margin-top: 18px;
      padding: 18px;
    }

    .receipt-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .receipt-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .receipt-line strong {
      color: var(--lime-soft);
      font-weight: 600;
    }

    .ending-screen {
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(320px, .75fr);
      align-items: center;
      gap: 8vw;
      min-height: calc(100vh - 36px);
      padding: 48px clamp(12px, 8vw, 120px);
    }

    .ending-screen h1 { font-size: 64px; }

    .ending-copy {
      max-width: 420px;
      margin-bottom: 30px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.8;
      white-space: pre-line;
    }

    .ending-receipt {
      border: 1px solid var(--line);
      padding: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .receipt-title {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      color: var(--lime);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .ending-receipt .receipt-line {
      padding: 12px 0;
      border-top: 1px dashed var(--line);
    }

    .ending-receipt .receipt-line:last-child { border-bottom: 1px dashed var(--line); }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-bar strong { color: var(--lime-soft); font-weight: 600; }

    .run-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .run-meta strong { color: var(--lime-soft); font-weight: 700; }

    .secondary-button {
      min-height: 44px;
      margin-left: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 16px;
      background: transparent;
      color: var(--lime-soft);
      cursor: pointer;
    }

    .secondary-button:hover { border-color: var(--lime); background: rgba(184, 214, 90, .08); }

    .run-overlay {
      min-height: calc(100vh - 36px);
      padding: clamp(28px, 7vw, 90px) clamp(12px, 8vw, 120px);
    }

    .overlay-card {
      width: min(900px, 100%);
      margin: 0 auto;
      border: 1px solid var(--line);
      padding: clamp(22px, 4vw, 42px);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .overlay-card h1 { margin-bottom: 14px; font-size: clamp(42px, 7vw, 72px); }
    .overlay-copy { max-width: 640px; color: var(--muted); line-height: 1.75; }
    .event-card { border-left: 2px solid var(--coral); margin: 22px 0; padding: 14px 16px; background: rgba(237, 118, 87, .08); }
    .event-card strong { display: block; margin-bottom: 5px; color: var(--lime-soft); }
    .daily-customer-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 28px; }
    .daily-customer { border: 1px solid var(--line); padding: 8px 10px; background: rgba(22, 41, 42, .7); color: var(--cream); font-size: 12px; }
    .settlement-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 22px 0; }
    .settlement-stat { border-top: 1px solid var(--line); padding-top: 10px; color: var(--muted); font-size: 12px; }
    .settlement-stat strong { display: block; margin-top: 4px; color: var(--lime-soft); font-size: 22px; }
    .trinket-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 24px 0; }
    .trinket-card { min-height: 178px; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; background: rgba(22, 41, 42, .75); color: var(--cream); cursor: pointer; text-align: left; }
    .trinket-card:hover, .trinket-card:focus-visible { border-color: var(--lime); background: rgba(184, 214, 90, .1); }
    .trinket-card strong { display: block; margin: 8px 0; color: var(--lime-soft); font-family: Georgia, "Times New Roman", serif; font-size: 21px; font-weight: 400; }
    .trinket-rarity { color: var(--coral); font-size: 11px; font-weight: 800; letter-spacing: .1em; }
    .trinket-description { color: var(--muted); font-size: 12px; line-height: 1.55; }
    .trinket-counts { display: flex; flex-wrap: wrap; gap: 16px; margin: 12px 0; color: var(--muted); font-size: 12px; }
    .trinket-counts strong { color: var(--lime-soft); }
    .trinket-summary { margin-top: 18px; color: var(--muted); font-size: 12px; }
    .trinket-card[aria-pressed="true"] { border-color: var(--lime); background: rgba(184, 214, 90, .12); }
    .trinket-card:disabled { cursor: default; opacity: .58; }
    .trinket-card small { display: block; margin-top: 9px; color: #d7e2c9; line-height: 1.5; }
    .trinket-drawer { border-top: 1px solid var(--line); padding-top: 18px; }
    .trinket-drawer h2 { margin: 0 0 10px; font-size: 19px; font-weight: 500; }
    .trinket-item { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; border-bottom: 1px solid var(--line); padding: 10px 0; color: var(--cream); font-size: 13px; }
    .trinket-item span { flex: 1 1 200px; }
    .trinket-item button, .trinket-actions button, .replace-list button { min-height: 44px; }
    .trinket-actions, .replace-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
    .trinket-notice { min-height: 22px; color: var(--coral); font-size: 13px; }
    .trinket-action-panel { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 16px; }
    .trinket-action-panel h2 { margin: 0; font-size: 19px; }

    @media (max-width: 680px) {
      .secondary-button { margin: 10px 0 0; }
      .settlement-stats, .trinket-grid { grid-template-columns: 1fr; }
      .trinket-card { min-height: 142px; }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(7px); }

    .night-dialogue {
      min-height: 138px;
      padding: 15px 17px;

    .global-audio {

    @media (max-width: 1100px) {

      .night-dialogue { min-height: 170px; padding: 12px; }
      .product-grid { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 6px; }
      .product-card { flex-direction: column; align-items: center; min-height: 122px; gap: 5px; padding: 8px 4px; position: relative; text-align: center; }
      .product-icon { width: 34px; height: 48px; flex-basis: 48px; }
      .product-name { font-size: 12px; }

    * { letter-spacing: 0 !important; }

<body>
  <main class="app-shell" id="app" data-screen="intro">
    <button class="audio-button global-audio" type="button" data-action="toggle-audio" aria-pressed="false">声音：关</button>
    <section class="intro-screen" data-screen-panel="intro" aria-labelledby="game-title">
      <div class="intro-copy-wrap">
        <p class="eyebrow">NIGHT SHIFT / 02:17</p>
        <h1 id="game-title">凌晨 2:17<br>的便利店</h1>
        <p class="intro-copy">给今晚还没结束的人，装一袋刚刚好的东西。</p>
        <button class="primary-button" type="button" data-action="start">开始值班</button>
        <button class="secondary-button" type="button" data-action="start-run">开始新一局</button>
        <p class="run-meta"><span>现实时间 <strong data-real-clock>--:--</strong></span><span data-time-mood>夜班从一盏灯开始。</span></p>
        <p class="intro-note">门铃响了。今晚还有三位客人。</p>
      </div>
      <div class="store-preview" data-intro-art aria-label="荧光绿夜班便利店预览"></div>
    </section>

    <section class="game-screen" data-screen-panel="game" hidden aria-labelledby="customer-name">
      <header class="topbar">
        <div class="topbar-meta">
          <span class="topbar-clock" data-clock>02:17</span>
          <span data-customer-progress>01 / 03</span>
          <span data-run-day>单晚</span>
          <span>现实 <strong data-real-clock>--:--</strong></span>
        </div>
      </header>

      <div class="game-layout">
        <div class="scene-column">
          <section class="store-stage" data-store-stage aria-label="便利店场景"></section>
          <section class="night-dialogue" data-night-dialogue aria-live="polite">
            <div data-dialogue-kicker></div>
            <p data-dialogue-main></p>
            <div data-dialogue-details></div>
          </section>
        </div>
        <aside class="customer-panel" data-customer-panel aria-live="polite"></aside>
      </div>

      <div class="inventory">
        <section class="inventory-section" aria-labelledby="shelf-heading">
          <div class="section-heading">
            <h3 id="shelf-heading">货架</h3>
            <span>03 ITEMS / ONE LITTLE BAG</span>
          </div>
          <div class="product-grid" data-product-grid aria-label="商品货架"></div>
        </section>
        <section class="inventory-section" aria-labelledby="bag-heading">
          <div class="section-heading">
            <h3 id="bag-heading">购物袋</h3>
            <span data-bag-count>0 / 3</span>
          </div>
          <div class="bag empty" data-bag aria-live="polite">还没有放入东西。</div>
          <div class="game-controls">
            <span class="helper-text" data-action-hint>袋子还空着。</span>
            <button class="primary-button" type="button" data-action="submit-bag" disabled>装袋</button>
          </div>
        </section>
      </div>

      <section class="receipt-panel" aria-labelledby="receipt-heading">
        <div class="section-heading">
          <h3 id="receipt-heading">夜班小票</h3>
          <span>KEEP THE LIGHT ON</span>
        </div>
        <div class="receipt-list" data-receipt aria-live="polite">
          <div class="receipt-line"><span>这一晚还没有客人</span><strong>02:17</strong></div>
        </div>
      </section>
    </section>

    <section class="run-overlay" data-screen-panel="day-intro" hidden aria-labelledby="day-intro-title">
      <div class="overlay-card" data-day-intro></div>
    </section>

    <section class="run-overlay" data-screen-panel="settlement" hidden aria-labelledby="settlement-title">
      <div class="overlay-card" aria-live="polite"></div>
    </section>

    <section class="run-overlay" data-screen-panel="trinket-reward" hidden aria-labelledby="trinket-title">
      <div class="overlay-card" aria-live="polite"></div>
    </section>

    <section class="ending-screen" data-screen-panel="ending" hidden aria-labelledby="ending-title"></section>
  </main>

  <script>
    (() => {
      const products = [
        { id: "coffee", name: "热咖啡", description: "苦一点，醒一点", tags: ["warmth", "energy"] },
        { id: "milk", name: "蜂蜜牛奶", description: "不太甜，刚好暖", tags: ["warmth", "comfort"] },
        { id: "bar", name: "能量棒", description: "再撑一小段路", tags: ["energy", "practical"] },
        { id: "warmer", name: "暖手贴", description: "掌心的一小团火", tags: ["warmth", "comfort"] },
        { id: "gum", name: "口香糖", description: "薄荷味的清醒", tags: ["energy"] },
        { id: "magazine", name: "杂志", description: "把等待翻成几页", tags: ["company"] },
        { id: "umbrella", name: "小雨伞", description: "雨里也能往前走", tags: ["practical", "comfort"] },
        { id: "battery", name: "电池", description: "给熄掉的灯续航", tags: ["light", "practical"] },
        { id: "hot-food", name: "热食", description: "坐一会儿再吃", tags: ["warmth", "company"] }
      ];

      const customers = [
        {
          id: "cheng",
          name: "阿成",
          role: "外卖员",
          line: "还有一单。手有点冷。",
          observation: "他揉了揉冻红的指节。头盔没有摘，手机又亮了一次。",
          needs: ["warmth", "energy"],
          hiddenNeeds: ["comfort"],
          response: {
            high: "他把袋子接过去，掌心终于有了一点热度，肩膀也松了一下。",
            mid: "他点点头，说了声谢谢，又看向门外。",
            low: "他把袋子挂在车把上，风很快又把门吹开了。"
          }
        },
        {
          id: "xiaoyu",
          name: "小雨",
          role: "学生",
          line: "我不饿，只想买点能带走的光。",
          observation: "书包上挂着一盏没电的小灯。她的目光，停在杂志上的那片星空。",
          needs: ["light", "company"],
          hiddenNeeds: ["comfort"],
          response: {
            high: "她把电池放进口袋，像是终于有了一盏备用的小灯。",
            mid: "她在货架前多站了一会儿，然后轻轻挥了挥手。",
            low: "她拿着袋子，却没有立刻走进雨里。"
          }
        },
        {
          id: "unnamed",
          name: "没有名字的人",
          role: "等雨的人",
          line: "雨停了我就走。",
          observation: "肩上落着雨，胃里响了一声。他看了看窗边那张空着的椅子。",
          needs: ["comfort", "company"],
          hiddenNeeds: ["warmth"],
          response: {
            high: "他在靠窗的位置坐下，雨声变得没有那么远了。",
            mid: "他看了看雨幕，说：“这里挺亮的。”",
            low: "他站在门边，像是在等一句还没有说出口的话。"
          }
        },
        {
          id: "linjie", name: "林姐", role: "护士", line: "我只剩十分钟，能不能帮我省一点心？", observation: "她把工牌翻到背面，眼睛还停在下一班车的时间上。", needs: ["energy", "practical"], hiddenNeeds: ["company"], response: { high: "她终于把肩膀放下来一点，说这次可以慢慢走。", mid: "她把东西收好，向门外的夜色点了点头。", low: "她看了一眼时间，又匆匆推门离开。" }
        },
        {
          id: "laochen", name: "老陈", role: "修理工", line: "灯坏了不要紧，人别跟着灭。", observation: "他的手套上沾着机油，口袋里露出一截旧电线。", needs: ["light", "practical"], hiddenNeeds: ["warmth"], response: { high: "他笑了一下，说这盏灯还能再亮很久。", mid: "他把东西揣进兜里，留下一个像焊点一样的笑。", low: "他看着天花板的灯管，没再说话。" }
        },
        {
          id: "earbuds", name: "戴耳机的人", role: "夜班乘客", line: "歌停了，外面就太安静了。", observation: "耳机线缠在袖口，他没有摘下来，只把音量调低。", needs: ["energy", "company"], hiddenNeeds: ["comfort"], response: { high: "他摘下一只耳机，第一次听见了店里的雨声。", mid: "他朝你比了个手势，像是在说收到了。", low: "他重新戴好耳机，把自己放回安静里。" }
        },
        {
          id: "repairer", name: "维修工", role: "凌晨值班", line: "工具在，事情就还有办法。", observation: "他的工具箱磕掉了一个角，手腕上有一圈白色胶带。", needs: ["practical", "warmth"], hiddenNeeds: ["energy"], response: { high: "他掂了掂袋子，说今晚的故障可以慢一点修。", mid: "他认真道谢，转身时工具箱没有再响。", low: "他点头离开，脚步还是很快。" }
        },
        {
          id: "courier-boss", name: "快递站老板", role: "还没下班", line: "最后一班车，总要有人等。", observation: "他把收件单折成很小一张，像是怕风把它吹走。", needs: ["company", "energy"], hiddenNeeds: ["practical"], response: { high: "他把那张收件单展开，说这次不会弄丢了。", mid: "他收下袋子，门外的车灯正好亮起来。", low: "他朝街角看了很久，才想起要离开。" }
        },
        {
          id: "father-son", name: "小男孩和爸爸", role: "找回家的路", line: "爸爸，店里为什么一直亮着？", observation: "小男孩抱着一只纸箱，爸爸的手一直护在他肩上。", needs: ["comfort", "company"], hiddenNeeds: ["light"], response: { high: "小男孩把一束光揣进怀里，爸爸向你点头。", mid: "他们在门口停了一会儿，才一起走进雨里。", low: "爸爸牵紧他的手，灯影慢慢缩小。" }
        }
      ];

      const trinkets = [
        { id: "old-coin", name: "旧硬币", rarity: "common", tags: ["practical"], description: "每轮第一次低分时，额外保留一点体面。", effect: { lowFloor: 1 } },
        { id: "warm-bulb", name: "暖黄灯泡", rarity: "common", tags: ["warmth", "light"], description: "命中温暖或光线时，结算分 +1。", effect: { tags: ["warmth", "light"], bonus: 1 } },

      function createSeededRandom(seed) {
        let value = seed >>> 0;
        return () => {
          value = (value * 1664525 + 1013904223) >>> 0;
          return value / 4294967296;
        };
      }

      function getSeedFromUrl() {
        const parsed = Number.parseInt(new URLSearchParams(location.search).get("seed") ?? "", 10);
        return Number.isFinite(parsed) ? parsed >>> 0 : (Date.now() >>> 0);
      }

      function getRealClock(date = new Date()) {
        return new Intl.DateTimeFormat("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false }).format(date);
      }

      function getNightClock(day) { return ["02:17", "03:06", "04:12"][day - 1] ?? "04:12"; }

      function getTimeMood(hour = Number(getRealClock().slice(0, 2))) {
        if (hour < 6) return "这个时间，只有还没睡的人知道。";
        if (hour < 12) return "城市醒了，昨晚的事还没有完全结束。";
        if (hour < 18) return "白天也有人把心事带进便利店。";
        return "夜班还没有开始，但灯已经提前亮了。";
      }

      function getDifficulty(day) {
        return { customerCount: [3, 4, 5][day - 1] ?? 5, hiddenNeeds: day >= 2, reducedClues: day >= 3, patiencePenalty: Math.max(0, day - 1) };
      }

      function buildDailyCustomers(day, seed, previousIds = []) {
        const random = createSeededRandom(seed + day * 7919);
        const count = getDifficulty(day).customerCount;
        const eligible = customers.map((customer) => ({ customer, weight: previousIds.includes(customer.id) ? .45 : 1 }));
        const chosen = [];
        while (chosen.length < count && eligible.length) {
          const index = Math.floor(random() * eligible.length);
          chosen.push(eligible.splice(index, 1)[0].customer);
        }
        return chosen;
      }

      function getDailyEvent(day, seed) {
        return dailyEvents[Math.floor(createSeededRandom(seed + day * 3571)() * dailyEvents.length)];
      }

      function getTrinketById(id) { return trinkets.find((trinket) => trinket.id === id); }
      function getEquippedTrinkets(run) { return run.equippedTrinkets.map(getTrinketById).filter(Boolean); }
      function getStoredTrinkets(run) { return run.inventory.filter((id) => !run.equippedTrinkets.includes(id)).map(getTrinketById).filter(Boolean); }
      function getSynergies(equippedIds) {
        const equipped = equippedIds.map(getTrinketById).filter(Boolean);
        return synergyRules.filter((rule) => equipped.some((first, index) =>
          first.tags.includes(rule.tags[0]) && equipped.some((second, otherIndex) =>
            otherIndex !== index && second.tags.includes(rule.tags[1]))));
      }
      function getSynergySummary(run) {
        const active = getSynergies(run.equippedTrinkets);
        return active.length ? active.map((rule) => `${rule.name}：${rule.detail}`).join("；") : "当前没有装备协同";
      }
      function canEquipTrinket(run, id) {
        if (!getTrinketById(id)) return { ok: false, reason: "饰品不存在" };
        if (run.equippedTrinkets.includes(id)) return { ok: false, reason: "已经装备" };
        if (run.equippedTrinkets.length >= 3) return { ok: false, reason: "装备槽已满，请选择替换" };
        if (!run.inventory.includes(id) && run.inventory.length >= 8) return { ok: false, reason: "背包已满，请选择替换" };
        return { ok: true };
      }
      function applyTrinketAction(run, { trinketId, action, replaceId }) {
        const next = { ...run, inventory: [...run.inventory], equippedTrinkets: [...run.equippedTrinkets] };
        if (action === "abandon") return { ok: true, state: next };
        if (!getTrinketById(trinketId)) return { ok: false, reason: "饰品不存在" };
        const owned = next.inventory.includes(trinketId);
        if (action === "store") {
          if (owned) return { ok: false, reason: "已经拥有这件饰品" };
          if (next.inventory.length >= 8) return { ok: false, reason: "背包已满" };
          next.inventory.push(trinketId);
        } else if (action === "unequip") {
          if (!next.equippedTrinkets.includes(trinketId)) return { ok: false, reason: "这件饰品未装备" };
          next.equippedTrinkets = next.equippedTrinkets.filter((id) => id !== trinketId);
        } else if (action === "equip") {
          const allowed = canEquipTrinket(run, trinketId);
          if (!allowed.ok) return allowed;
          if (!owned) next.inventory.push(trinketId);
          next.equippedTrinkets.push(trinketId);
        } else if (action === "replace") {
          if (!next.equippedTrinkets.includes(replaceId) || replaceId === trinketId) return { ok: false, reason: "请选择要卸下的装备" };
          if (!owned && next.inventory.length >= 8) next.inventory = next.inventory.filter((id) => id !== replaceId);
          if (!owned) next.inventory.push(trinketId);
          next.equippedTrinkets = next.equippedTrinkets.map((id) => id === replaceId ? trinketId : id);
        } else return { ok: false, reason: "未知操作" };
        return { ok: true, state: next };
      }
      function getCoveredTags(selectedIds) {
        return [...new Set(products.filter((product) => selectedIds.includes(product.id)).flatMap((product) => product.tags))];
      }
      function getUncoveredNeeds(customer, selectedIds) {
        const covered = new Set(getCoveredTags(selectedIds));
        return customer.needs.filter((need) => !covered.has(need));

      function getTrinketModifiers(trinketIds, context) {
        const result = trinketIds
          .map((id) => trinkets.find((trinket) => trinket.id === id))
          .filter(Boolean)
          .reduce((result, trinket) => {
            const effect = trinket.effect;
            if (effect.tags?.some((tag) => context.selectedTags.has(tag))) {
              result.scoreBonus += effect.bonus ?? 0;
              result.triggeredTrinkets.push(trinket.name);
            }
            if (effect.synergy?.every((tag) => context.selectedTags.has(tag))) {
              result.scoreBonus += effect.bonus ?? 0;
              result.triggeredTrinkets.push(trinket.name);
            }
            if (effect.hiddenBonus && context.hiddenNeedHit) {
              result.scoreBonus += effect.hiddenBonus;
              result.triggeredTrinkets.push(trinket.name);
            }
            if (effect.lowFloor) {
              result.lowFloor = Math.max(result.lowFloor, effect.lowFloor);
              result.lowFloorSource = trinket.name;
            }
            if (effect.volatile) result.volatileSource = trinket.name;
            return result;
          }, { scoreBonus: 0, lowFloor: 0, lowFloorSource: null, volatileSource: null, triggeredTrinkets: [] });
        result.synergies = getSynergies(trinketIds);
        if (context.hiddenNeedHit && result.synergies.some((rule) => rule.name === "倾听构筑")) result.scoreBonus += 1;
        return result;
      }

      function scoreSelection(customer, selectedIds, trinketIds = state.equippedTrinkets, event = null, day = state.day) {
        const coveredTags = getCoveredTags(selectedIds);
        const selectedTags = new Set(coveredTags);
        const tagWeights = event?.tagWeights ?? {};
        const visibleScore = customer.needs.reduce((score, need) => score + (selectedTags.has(need) ? (tagWeights[need] ?? 1) : 0), 0);
        const hiddenScore = day >= 2 ? customer.hiddenNeeds.reduce((score, need) => score + (selectedTags.has(need) ? 1 : 0), 0) : 0;
        const hiddenNeedHit = hiddenScore > 0 || Boolean(event?.hiddenNeedSubstitute && selectedTags.has(event.hiddenNeedSubstitute));
        const modifiers = getTrinketModifiers(trinketIds, { customer, selectedTags, day, hiddenNeedHit });
        let score = Math.min(3, Math.max(0, Math.round(visibleScore + hiddenScore + modifiers.scoreBonus)));
        const triggeredSynergies = [];
        if (hiddenNeedHit && modifiers.synergies.some((rule) => rule.name === "倾听构筑")) triggeredSynergies.push("倾听构筑");
        const riskSynergy = modifiers.synergies.some((rule) => rule.name === "波动构筑");
        if (riskSynergy && score >= 2 && score < 3) {
          score += 1;
          triggeredSynergies.push("波动构筑");
        }
        if (score < 2 && modifiers.synergies.some((rule) => rule.name === "温暖构筑")) {
          score += 1;
          triggeredSynergies.push("温暖构筑");
        }
        if (score < 1 && modifiers.lowFloor) {
          score = 1;
          if (modifiers.lowFloorSource) modifiers.triggeredTrinkets.push(modifiers.lowFloorSource);
        }
        const volatile = score < 2 && (riskSynergy || Boolean(modifiers.volatileSource));
        if (volatile && riskSynergy) triggeredSynergies.push("波动构筑");
        if (volatile && modifiers.volatileSource) modifiers.triggeredTrinkets.push(modifiers.volatileSource);
        return { score, coveredTags, visibleNeedHits: customer.needs.filter((need) => selectedTags.has(need)), visibleScore, hiddenNeedHit,
          triggeredTrinkets: [...new Set(modifiers.triggeredTrinkets)], triggeredSynergies,
          hasSynergy: modifiers.synergies.length > 0, volatile, responseLevel: responseLevel(score) };
      }

      function getTrinketTriggerSummary(result) {
        const details = result.triggeredTrinkets.map((name) => `${name}（${trinketRuleText(getTrinketById(trinkets.find((item) => item.name === name)?.id))}）`);
        const synergyDetails = result.triggeredSynergies.map((name) => `${name}（${synergyRules.find((rule) => rule.name === name)?.detail ?? "效果生效"}）`);
        const names = [...details, ...synergyDetails];
        return names.length ? `饰品生效：${names.join("；")}${result.volatile ? "；本轮波动" : ""}` : "饰品生效：本轮无触发";

      function selectedProducts() {
        return products.filter((product) => state.selectedProductIds.includes(product.id));
      }

      function currentCustomers() {
        return state.mode === "roguelite" ? state.dailyCustomers : customers.slice(0, 3);
      }

      function getDailySettlement(day, scores = state.dailyScores, entries = state.dailyEntries, event = state.currentEvent) {
        const average = scores.length ? scores.reduce((sum, score) => sum + score, 0) / scores.length : 0;
        const helpRate = Math.round((scores.filter((score) => score >= 2).length / Math.max(1, scores.length)) * 100);
        const hiddenNeedHits = entries.filter((entry) => entry.hiddenNeedHit).length;
        const bestStreak = entries.reduce((best, entry, index) => Math.max(best, entries.slice(0, index + 1).slice(-3).filter((item) => item.score >= 2).length), 0);
        return { average, helpRate, hiddenNeedHits, bestStreak, qualityScore: Math.round(day + average + hiddenNeedHits + bestStreak + (event?.bonus ?? 0)) };
      }

      function getTrinketQuality(settlement, day) {
        if (day === 3 && settlement.qualityScore >= 8) return ["rare", "epic", "legendary"];
        if (settlement.qualityScore >= 8) return ["rare", "epic"];
        if (settlement.qualityScore >= 6) return ["rare"];
        if (settlement.qualityScore >= 3) return ["common", "rare"];
        return ["common"];
      }

      function rarityLabel(rarity) {
        return { common: "普通", rare: "稀有", epic: "史诗", legendary: "传说" }[rarity] ?? rarity;
      }

      function trinketRuleText(trinket) {
        const effect = trinket.effect;
        if (effect.lowFloor) return "低分时保底 1 分";
        if (effect.hiddenBonus) return `命中隐藏需求时加 ${effect.hiddenBonus} 分`;
        if (effect.tags) return `选中${effect.tags.map((tag) => tagLabels[tag]).join("或")}时加 ${effect.bonus} 分`;
        if (effect.synergy) return `商品覆盖${effect.synergy.map((tag) => tagLabels[tag]).join("与")}时加 ${effect.bonus} 分`;
        if (effect.volatile) return "低分标记为波动";
        if (effect.streakBonus) return "结算时增加连击品质";
        return "第 3 天保留完整线索";
      }

      function createTrinketChoices() {
        const settlement = getDailySettlement(state.day);
        const qualities = getTrinketQuality(settlement, state.day);
        const available = trinkets.filter((trinket) => !state.inventory.includes(trinket.id));
        const random = createSeededRandom(state.runSeed + state.day * 104729 + state.dailyScores.length);
        const choices = [];
        const preferred = available.filter((trinket) => qualities.includes(trinket.rarity));
        while (choices.length < 3 && preferred.length) choices.push(preferred.splice(Math.floor(random() * preferred.length), 1)[0]);
        const remaining = available.filter((trinket) => !choices.some((choice) => choice.id === trinket.id));
        while (choices.length < 3 && remaining.length) choices.push(remaining.splice(Math.floor(random() * remaining.length), 1)[0]);
        return choices;
      }

      function startRun() {
        state.mode = "roguelite";
        state.runSeed = getSeedFromUrl();
        state.day = 1;
        state.inventory = [];
        state.equippedTrinkets = [];
        state.dailyScores = [];
        state.dailyEntries = [];
        state.runReceipt = [];
        state.hiddenNeedHits = 0;
        state.dailyHiddenNeedHits = 0;
        state.streak = 0;
        state.dailyBestStreak = 0;
        state.trinketDraftId = null;
        state.trinketAction = null;
        state.replacingTrinketId = null;
        state.trinketNotice = null;
        state.dailyCustomers = buildDailyCustomers(1, state.runSeed);
        state.currentEvent = getDailyEvent(1, state.runSeed);
        state.gameClock = getNightClock(1);
        state.screen = "day-intro";
        state.realClock = getRealClock();
        render();
        dayIntroPanel.querySelector('[data-action="begin-day"]')?.focus({ preventScroll: true });
      }

      function beginDay() {
        state.screen = "game";
        state.customerIndex = 0;
        state.selectedProductIds = [];
        state.roundScores = [];
        state.receipt = [];
        state.dailyScores = [];
        state.dailyEntries = [];
        state.trinketChoices = [];
        state.trinketDraftId = null;
        state.trinketAction = null;
        state.replacingTrinketId = null;
        state.trinketNotice = null;
        state.dailyHiddenNeedHits = 0;
        state.streak = 0;
        state.showFeedback = false;
        state.lastFeedback = null;
        state.lastRoundResult = null;
        render();
        productGrid.querySelector("[data-product-card]:not([disabled])")?.focus({ preventScroll: true });
      }

      function advanceRunDay() {
        if (state.day < state.maxDays) {
          state.day += 1;
          state.dailyCustomers = buildDailyCustomers(state.day, state.runSeed, state.dailyCustomers.map((customer) => customer.id));
          state.currentEvent = getDailyEvent(state.day, state.runSeed);
          state.gameClock = getNightClock(state.day);
          state.screen = "day-intro";
        } else {
          state.screen = "ending";
        }
        render();
        const focusTarget = state.screen === "day-intro" ? '[data-action="begin-day"]' : '[data-action="restart"]';
        document.querySelector(focusTarget)?.focus({ preventScroll: true });
      }

      function chooseTrinket(id) {
        if (!state.trinketChoices.some((item) => item.id === id) || state.inventory.includes(id)) return;
        state.trinketDraftId = id;
        state.trinketAction = "draft";
        state.replacingTrinketId = null;
        state.trinketNotice = null;
        render();
        trinketPanel.querySelector('[data-action="draft-equip"]')?.focus({ preventScroll: true });
      }

      function commitTrinket(action, id, replaceId) {
        const result = applyTrinketAction(state, { trinketId: id, action, replaceId });
        if (!result.ok) {
          state.trinketNotice = result.reason;
        } else {
          state.inventory = result.state.inventory;
          state.equippedTrinkets = result.state.equippedTrinkets;
          state.trinketNotice = action === "unequip" ? "已卸下" : action === "replace" ? "已替换装备" : action === "store" ? "已放入背包" : "已装备";
          if (id === state.trinketDraftId && ["equip", "store", "replace"].includes(action)) {
            state.trinketAction = "managed";
            state.replacingTrinketId = null;
          }
        }
        render();
        trinketPanel.querySelector('[data-action="next-day"], [data-action="cancel-replace"], [data-trinket-choice]')?.focus({ preventScroll: true });
      }

      function renderDayIntro() {
        const event = state.currentEvent;
        dayIntroPanel.innerHTML = `<div class="overlay-card" data-day-intro-content>
          <p class="eyebrow">NIGHT SHIFT / DAY ${state.day}</p>
          <h1 id="day-intro-title">第 ${state.day} 天</h1>
          <p class="overlay-copy">叙事时间 ${state.gameClock}。现实时间 <strong data-real-clock>${state.realClock}</strong>。今晚的顾客不会完全按照昨天的样子出现。</p>
          <div class="event-card" data-night-event><strong>${event.name}</strong><span>${event.description}</span></div>
          <div class="daily-customer-list" data-customer-count="${state.dailyCustomers.length}">${state.dailyCustomers.map((customer) => `<span class="daily-customer" data-daily-customer data-customer-id="${customer.id}">${customer.name}</span>`).join("")}</div>
          <p class="trinket-summary">装备：${state.equippedTrinkets.length ? state.equippedTrinkets.map((id) => trinkets.find((item) => item.id === id)?.name).join(" · ") : "还没有饰品"}</p>
          <button class="primary-button" type="button" data-action="begin-day">开始营业</button>
        </div>`;
      }

      function renderSettlement() {
        const settlement = getDailySettlement(state.day);
        const finalDay = state.day === state.maxDays;
        settlementPanel.innerHTML = `<div class="overlay-card" data-settlement>
          <p class="eyebrow">DAILY SETTLEMENT / DAY ${state.day}</p>
          <h1 id="settlement-title">今晚留下了什么</h1>
          <p class="overlay-copy">你没有解决所有人的夜晚，但可以看看这一天的灯有没有更稳。</p>
          <div class="settlement-stats"><div class="settlement-stat">帮助率<strong data-help-rate>${settlement.helpRate}%</strong></div><div class="settlement-stat">隐藏需求<strong data-hidden-hit-count>${settlement.hiddenNeedHits}</strong></div><div class="settlement-stat">平均分<strong>${settlement.average.toFixed(1)}</strong></div><div class="settlement-stat">品质分<strong>${settlement.qualityScore}</strong></div></div>
          <p data-quality-range class="overlay-copy">${finalDay ? "三天的最后一张小票已经打印。" : `下一件饰品可能为：${getTrinketQuality(settlement, state.day).map(rarityLabel).join(" / ")}`}</p>
          <button class="primary-button" type="button" data-action="continue-to-trinkets">${finalDay ? "查看今晚结局" : "继续到饰品"}</button>
        </div>`;
      }

      function renderTrinketReward() {
        const settlement = getDailySettlement(state.day);
        state.trinketChoices = state.trinketChoices.length ? state.trinketChoices : createTrinketChoices();
        const draft = getTrinketById(state.trinketDraftId);
        const pending = state.trinketAction === "draft" || state.trinketAction === "replace";
        const candidateLocked = state.trinketAction === "managed" || state.trinketAction === "replace";
        const replacing = getTrinketById(state.replacingTrinketId);
        const preview = replacing && draft ? getSynergySummary({ equippedTrinkets: [...state.equippedTrinkets.filter((id) => id !== replacing.id), draft.id] }) : "";
        trinketPanel.innerHTML = `<div class="overlay-card" data-trinket-reward>
          <p class="eyebrow">A SMALL THING TO KEEP</p><h1 id="trinket-title">值班抽屉</h1>
          <p class="overlay-copy">品质区间：<span data-quality-range>${getTrinketQuality(settlement, state.day).map(rarityLabel).join(" / ")}</span></p>
          <div class="trinket-counts"><span>背包 <strong data-inventory-count>${state.inventory.length} / 8</strong></span><span>装备 <strong data-equipped-count>${state.equippedTrinkets.length} / 3</strong></span></div>
          <section data-trinket-candidates>
            <div class="trinket-grid">${state.trinketChoices.map((item) => `<button class="trinket-card" type="button" data-trinket-choice data-trinket-id="${item.id}" aria-pressed="${item.id === state.trinketDraftId}" ${candidateLocked || state.inventory.includes(item.id) ? "disabled" : ""}>
              <span class="trinket-rarity">${rarityLabel(item.rarity)} · ${item.tags.map((tag) => tagLabels[tag]).join(" / ")}</span><strong>${item.name}</strong>
              <span class="trinket-description">${item.description}</span><small>规则：${trinketRuleText(item)}</small>
              <small>${getSynergies([...state.equippedTrinkets, item.id]).map((rule) => `与当前装备组成${rule.name}`).join("；") || "当前无新协同"} · ${state.inventory.includes(item.id) ? "已拥有" : "候选"}</small>
            </button>`).join("")}</div>
          </section>
          <section class="trinket-drawer" data-trinket-drawer>
            <h2>背包与装备</h2><p class="trinket-summary" data-synergy-summary>${getSynergySummary(state)}</p>
            ${state.inventory.length ? state.inventory.map((id) => {
              const item = getTrinketById(id);
              const equipped = state.equippedTrinkets.includes(id);
              return `<div class="trinket-item"><span>${item.name} · ${equipped ? "已装备" : "背包"}</span><button class="secondary-button" type="button" data-action="${equipped ? "unequip" : "equip-owned"}" data-trinket-id="${id}">${equipped ? "卸下" : "装备"}</button></div>`;
            }).join("") : "<p class=\"overlay-copy\">背包里还没有饰品。</p>"}
          </section>
          <section class="trinket-action-panel" data-trinket-action-panel ${pending ? "" : "hidden"}>
            <h2>${state.trinketAction === "replace" ? "选择要卸下的饰品" : `如何处理${draft?.name ?? ""}？`}</h2>
            ${state.trinketAction === "replace" ? `<div class="replace-list">${getEquippedTrinkets(state).map((item) => `<button class="secondary-button" type="button" data-action="preview-replace" data-trinket-id="${item.id}" aria-pressed="${item.id === state.replacingTrinketId}">${item.name}</button>`).join("")}</div>
              <p class="trinket-summary">${replacing ? `卸下${replacing.name} / 装备${draft.name}；${preview}` : "选择一件已装备的饰品查看变化。"}</p>
              <div class="trinket-actions"><button class="primary-button" type="button" data-action="confirm-replace" ${replacing ? "" : "disabled"}>确认替换</button><button class="secondary-button" type="button" data-action="cancel-replace">返回操作</button></div>` :
              `<div class="trinket-actions"><button class="primary-button" type="button" data-action="draft-equip">装备</button><button class="secondary-button" type="button" data-action="draft-store">放入背包</button><button class="secondary-button" type="button" data-action="draft-abandon">放弃</button></div>`}
          </section>
          <p class="trinket-notice" role="status">${state.trinketNotice ?? ""}</p>
          ${state.trinketAction === "managed" ? `<button class="primary-button" type="button" data-action="next-day">${state.day === state.maxDays ? "查看结局" : "进入下一天"}</button>` : ""}
        </div>`;
      }

      function startGame() {
        state.mode = "legacy";
        state.screen = "game";
        state.customerIndex = 0;
        state.selectedProductIds = [];
        state.roundScores = [];
        state.receipt = [];
        state.showFeedback = false;
        state.lastFeedback = null;
        state.day = 1;
        state.gameClock = "02:17";
        state.realClock = getRealClock();
        render();
        productGrid.querySelector("[data-product-card]")?.focus({ preventScroll: true });
        playTone(340, .08);
      }

      function resetGame() {
        state.screen = "intro";
        state.mode = "legacy";
        state.day = 1;
        state.inventory = [];
        state.equippedTrinkets = [];
        state.dailyCustomers = [];
        state.currentEvent = null;
        state.trinketChoices = [];
        state.trinketDraftId = null;
        state.trinketAction = null;
        state.replacingTrinketId = null;
        state.trinketNotice = null;
        state.customerIndex = 0;
        state.selectedProductIds = [];
        state.roundScores = [];
        state.receipt = [];
        state.showFeedback = false;
        state.lastFeedback = null;
        state.lastRoundResult = null;
        state.realClock = getRealClock();
        render();
        startButton.focus({ preventScroll: true });
      }

      function renderCustomer() {
        const customer = currentCustomers()[state.customerIndex];
        const feedback = state.showFeedback
          ? `<div class="feedback" data-feedback>${state.lastFeedback}</div>
             <button class="primary-button" type="button" data-action="continue">继续</button>`
          : "";
        const hiddenClue = state.mode === "roguelite" && state.day >= 2 && !state.showFeedback
          ? `<p class="customer-hint" data-hidden-clue>隐藏线索：${state.day >= 3 ? "他没有说出口的那句话，被雨声盖住了一半。" : customer.observation}</p>`
          : "";

        customerPanel.innerHTML = `
          <p class="customer-index">CUSTOMER ${String(state.customerIndex + 1).padStart(2, "0")}</p>
          <h2 id="customer-name" tabindex="-1">${customer.name}</h2>
          <p class="customer-role">${customer.role}</p>
          <blockquote>${customer.line}</blockquote>
          <p class="customer-observation" data-observation>${customer.observation}</p>
          ${hiddenClue}
          ${feedback}
        `;
      }

      function renderStage() {
        const stageTone = state.showFeedback ? responseLevel(state.roundScores.at(-1)) : "";
        stage.dataset.tone = stageTone;
        stage.innerHTML = sceneArtwork(state.customerIndex, state.showFeedback);
        const lines = getRoundDialogue(state, currentCustomers()[state.customerIndex], state.selectedProductIds, state.showFeedback ? state.lastRoundResult : null);
        dialogue.querySelector("[data-dialogue-kicker]").textContent = lines.kicker;
        dialogue.querySelector("[data-dialogue-main]").textContent = lines.main;
        dialogue.querySelector("[data-dialogue-details]").textContent = lines.details;
      }

      function renderProducts() {
        const disabled = state.showFeedback;
        const blocked = new Set(state.mode === "roguelite" ? (state.currentEvent?.blockedProductIds ?? []) : []);
        productGrid.innerHTML = products.map((product) => {
          const selected = state.selectedProductIds.includes(product.id);
          const unavailable = !selected && state.selectedProductIds.length >= 3;
          const eventBlocked = blocked.has(product.id);
          return `
            <button class="product-card${selected ? " is-selected" : ""}" type="button"
              data-product-card data-product-id="${product.id}"
              aria-pressed="${selected}" ${disabled || unavailable || eventBlocked ? "disabled" : ""}>
              <span class="product-icon" aria-hidden="true">${productDrawing(product.id)}</span>
              <span><span class="product-name">${product.name}</span><span class="product-description">${eventBlocked ? "暂时不可取" : product.description}</span></span>
              <svg class="selected-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
            </button>
          `;
        }).join("");
      }

      function renderBag() {
        const selected = selectedProducts();
        bagCount.textContent = `${selected.length} / 3`;
        submitButton.disabled = selected.length !== 3 || state.showFeedback;
        bag.classList.toggle("empty", selected.length === 0);
        bag.innerHTML = selected.length
          ? `<div class="bag-list">${selected.map((product) => `<span class="bag-item">${productDrawing(product.id)}${product.name}</span>`).join("")}</div>`
          : `<div class="bag-empty">还没有放入东西。</div>`;
        document.querySelector("[data-action-hint]").textContent = state.showFeedback ? "心意已经递出去了。" : selected.length === 3 ? "这一袋，就这样。" : `还留着 ${3 - selected.length} 个位置。`;
      }

      function receiptMood(score) {
        return score >= 2 ? "刚刚好" : score === 1 ? "有一点用" : "还在路上";
      }

      function renderReceipt() {
        if (!state.receipt.length) {
          receipt.innerHTML = `<div class="receipt-line"><span>这一晚还没有客人</span><strong>02:17</strong></div>`;
          return;
        }
        receipt.innerHTML = state.receipt.map((entry) => {
          const productNames = entry.productIds.map((id) => products.find((product) => product.id === id)?.name).join(" · ");
          return `<div class="receipt-line"><span>${entry.customerName} · ${productNames}</span><strong>${receiptMood(entry.score)}</strong></div>`;
        }).join("");
      }

      function renderEnding() {
        const runScores = state.mode === "roguelite" ? state.dailyEntries.map((entry) => entry.score) : state.roundScores;
        const runTotal = state.mode === "roguelite" ? state.runReceipt.reduce((sum, entry) => sum + entry.score, 0) : runScores.reduce((sum, score) => sum + score, 0);
        const hasSynergy = getSynergies(state.equippedTrinkets).length > 0;
        let endingKey = getEnding(runScores);
        if (state.mode === "roguelite") {
          if (runTotal >= 22 && state.hiddenNeedHits >= 3 && hasSynergy) endingKey = "shared-light";
          else if (runTotal >= 22 && state.hiddenNeedHits >= 3) endingKey = "bright";
          else if (state.equippedTrinkets.some((id) => trinkets.find((item) => item.id === id)?.effect.volatile) && runTotal < 18) endingKey = "tomorrow";
          else if (runTotal >= 15) endingKey = "rain";
          else endingKey = "stay";
        }
        const ending = state.mode === "roguelite" && ["shared-light", "tomorrow"].includes(endingKey)
          ? { title: endingKey === "shared-light" ? "这盏灯不是一个人点亮的" : "明天还会有人来", copy: endingKey === "shared-light" ? "三天里，你一次次把灯递给了别人。\n后来才发现，灯光也沿着那些人，回到了你这里。" : "有些夜晚没有被整理好。\n但门铃会响，灯也会亮，明天还会有人来。", tone: endingKey === "shared-light" ? "warm" : "rain" }
          : endings[endingKey];
        endingPanel.dataset.tone = ending.tone;
        endingPanel.innerHTML = `
          <div class="ending-copy-wrap">
            <p class="eyebrow">NIGHT SHIFT / LAST RECEIPT</p>
            <h1 id="ending-title">${ending.title}</h1>
            <p class="ending-copy">${ending.copy}</p>
            <button class="primary-button" type="button" data-action="restart">${state.mode === "roguelite" ? "再来一局" : "再来一晚"}</button>
          </div>
          <div class="ending-receipt">
            <div class="receipt-title"><span>KEEP THE LIGHT ON</span><span>${state.mode === "roguelite" ? `现实 ${state.realClock}` : "02:17"}</span></div>
            <div class="receipt-list">
              ${(state.mode === "roguelite" ? state.runReceipt : state.receipt).map((entry) => {
                const names = entry.productIds.map((id) => products.find((product) => product.id === id)?.name).join(" · ");
                return `<div class="receipt-line"><span>${entry.customerName}<br><small>${names}</small></span><strong>${receiptMood(entry.score)}</strong></div>`;
              }).join("")}
            </div>
            <div class="status-bar"><span>${state.mode === "roguelite" ? `饰品：${state.equippedTrinkets.map((id) => trinkets.find((item) => item.id === id)?.name).join(" · ") || "无"}` : "这家店，暂时还没有关灯。"}</span><strong>${state.mode === "roguelite" ? "三天 / 一局" : "3 位客人 / 3 袋心意"}</strong></div>
          </div>
        `;
      }

      function renderAudioButton() {
        const label = state.audioUnavailable ? "声音：不可用" : state.audioEnabled ? "声音：开" : "声音：关";
        audioButton.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m11 5-6 4H2v6h3l6 4V5Z"/>
          ${state.audioEnabled ? '<path d="M15.5 8.5a5 5 0 0 1 0 7m3-10a9 9 0 0 1 0 13"/>' : '<path d="m17 9 5 6m0-6-5 6"/>'}
          </svg><span>${label}</span>`;
        audioButton.title = state.audioUnavailable ? "浏览器暂不支持声音，仍可继续值班" : state.audioEnabled ? "关闭雨声与提示音" : "开启雨声与提示音";
        audioButton.setAttribute("aria-label", label);
        audioButton.setAttribute("aria-pressed", String(state.audioEnabled));
      }

      function render() {
        app.dataset.screen = state.screen;
        introPanel.hidden = state.screen !== "intro";
        gamePanel.hidden = state.screen !== "game";
        dayIntroPanel.hidden = state.screen !== "day-intro";
        settlementPanel.hidden = state.screen !== "settlement";
        trinketPanel.hidden = state.screen !== "trinket-reward";
        endingPanel.hidden = state.screen !== "ending";

        document.querySelectorAll("[data-run-day]").forEach((node) => { node.textContent = state.mode === "roguelite" ? `第 ${state.day} 天` : "单晚"; });
        document.querySelectorAll("[data-clock]").forEach((node) => { node.textContent = state.mode === "roguelite" ? state.gameClock : "02:17"; });

        if (state.screen === "game") {
          const total = currentCustomers().length;
          progress.textContent = `${String(state.customerIndex + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}`;
          renderCustomer();
          renderStage();
          renderProducts();
          renderBag();
          renderReceipt();
        } else if (state.screen === "day-intro") {
          renderDayIntro();
        } else if (state.screen === "settlement") {
          renderSettlement();
        } else if (state.screen === "trinket-reward") {
          renderTrinketReward();
        } else if (state.screen === "ending") {
          renderEnding();
        }
        document.querySelectorAll("[data-real-clock]").forEach((node) => { node.textContent = state.realClock; });
        document.querySelectorAll("[data-time-mood]").forEach((node) => { node.textContent = getTimeMood(); });
        renderAudioButton();
      }

      function playTone(frequency, duration) {
        if (!state.audioEnabled) return;
        try {
          audioContext ??= new AudioContext();
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = "sine";
          oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(.0001, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(.045, audioContext.currentTime + .015);
          gain.gain.exponentialRampToValueAtTime(.0001, audioContext.currentTime + duration);
          oscillator.connect(gain).connect(audioContext.destination);
          oscillator.start();
          oscillator.stop(audioContext.currentTime + duration + .02);
        } catch {
          state.audioEnabled = false;
          state.audioUnavailable = true;
          renderAudioButton();
        }
      }

      let rainSource = null;
      let ambienceGain = null;

      function startAmbience() {
        if (rainSource) return;
        const buffer = audioContext.createBuffer(1, audioContext.sampleRate * 2, audioContext.sampleRate);
        const samples = buffer.getChannelData(0);
        for (let i = 0; i < samples.length; i += 1) samples[i] = Math.random() * 2 - 1;
        rainSource = audioContext.createBufferSource();
        rainSource.buffer = buffer;
        rainSource.loop = true;
        const filter = audioContext.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 1350;
        ambienceGain = audioContext.createGain();
        ambienceGain.gain.value = .018;
        rainSource.connect(filter).connect(ambienceGain).connect(audioContext.destination);
        rainSource.start();
      }

      function stopAmbience() {
        rainSource?.stop();
        rainSource?.disconnect();
        ambienceGain?.disconnect();
        rainSource = null;
        ambienceGain = null;
      }

      async function setAudioEnabled(enabled) {
        audioButton.disabled = true;
        try {
          if (enabled) {
            audioContext ??= new AudioContext();
            await audioContext.resume();
            state.audioEnabled = true;
            state.audioUnavailable = false;
            startAmbience();
            playTone(520, .09);
          } else {
            state.audioEnabled = false;
            stopAmbience();
          }
        } catch {
          state.audioEnabled = false;
          state.audioUnavailable = true;
          stopAmbience();
          if (audioContext) {
            await audioContext.close().catch(() => {});
            audioContext = null;
          }
        } finally {
          audioButton.disabled = false;
          renderAudioButton();
        }
      }

      startButton.addEventListener("click", startGame);
      startRunButton.addEventListener("click", startRun);
      audioButton.addEventListener("click", () => setAudioEnabled(!state.audioEnabled));

      dayIntroPanel.addEventListener("click", (event) => {
        if (event.target.closest('[data-action="begin-day"]')) beginDay();
      });

      settlementPanel.addEventListener("click", (event) => {
        if (!event.target.closest('[data-action="continue-to-trinkets"]')) return;
        state.trinketChoices = createTrinketChoices();
        state.trinketDraftId = null;
        state.trinketAction = null;
        state.replacingTrinketId = null;
        state.trinketNotice = null;
        state.screen = "trinket-reward";
        render();
        trinketPanel.querySelector("[data-trinket-choice]")?.focus({ preventScroll: true });
      });

      trinketPanel.addEventListener("click", (event) => {
        const choice = event.target.closest("[data-trinket-choice]");
        if (choice) { chooseTrinket(choice.dataset.trinketId); return; }
        const action = event.target.closest("[data-action]")?.dataset.action;
        const id = event.target.closest("[data-trinket-id]")?.dataset.trinketId;
        if (action === "next-day" || action === "draft-abandon") { advanceRunDay(); return; }
        if (action === "draft-store") { commitTrinket("store", state.trinketDraftId); return; }
        if (action === "draft-equip" || action === "equip-owned") {
          const targetId = action === "draft-equip" ? state.trinketDraftId : id;
          if (state.equippedTrinkets.length >= 3 || (!state.inventory.includes(targetId) && state.inventory.length >= 8)) {
            state.trinketDraftId = targetId;
            state.trinketAction = "replace";
            state.replacingTrinketId = null;
            state.trinketNotice = "选择一件已装备的饰品";
            render();
            trinketPanel.querySelector('[data-action="preview-replace"]')?.focus({ preventScroll: true });
          } else commitTrinket("equip", targetId);
          return;
        }
        if (action === "unequip") { commitTrinket("unequip", id); return; }
        if (action === "preview-replace") {
          state.replacingTrinketId = id;
          render();
          trinketPanel.querySelector('[data-action="confirm-replace"]')?.focus({ preventScroll: true });
          return;
        }
        if (action === "confirm-replace") { commitTrinket("replace", state.trinketDraftId, state.replacingTrinketId); return; }
        if (action === "cancel-replace") {
          state.trinketAction = state.inventory.includes(state.trinketDraftId) ? "managed" : "draft";
          state.replacingTrinketId = null;
          state.trinketNotice = null;
          render();
          trinketPanel.querySelector('[data-action="draft-equip"], [data-action="next-day"]')?.focus({ preventScroll: true });
        }
      });
      trinketPanel.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && state.trinketAction === "replace") {
          event.preventDefault();
          state.trinketAction = state.inventory.includes(state.trinketDraftId) ? "managed" : "draft";
          state.replacingTrinketId = null;
          render();
          trinketPanel.querySelector('[data-action="draft-equip"], [data-action="next-day"]')?.focus({ preventScroll: true });
        }
      });

      productGrid.addEventListener("click", (event) => {
        const card = event.target.closest("[data-product-card]");
        if (!card || state.screen !== "game" || state.showFeedback) return;
        const productId = card.dataset.productId;
        const existingIndex = state.selectedProductIds.indexOf(productId);
        if (existingIndex >= 0) {
          state.selectedProductIds.splice(existingIndex, 1);
        } else if (state.selectedProductIds.length < 3) {
          state.selectedProductIds.push(productId);
          playTone(280 + state.selectedProductIds.length * 70, .06);
        }
        render();
        productGrid.querySelector(`[data-product-id="${productId}"]`)?.focus({ preventScroll: true });
      });

      submitButton.addEventListener("click", () => {
        if (state.selectedProductIds.length !== 3 || state.showFeedback) return;
        const customer = currentCustomers()[state.customerIndex];
        const scored = scoreSelection(customer, state.selectedProductIds,
          state.mode === "roguelite" ? state.equippedTrinkets : [],
          state.mode === "roguelite" ? state.currentEvent : null,
          state.mode === "roguelite" ? state.day : 1);
        const score = scored.score;
        state.roundScores.push(score);
        if (state.mode === "roguelite") {
          state.dailyScores.push(score);
          state.dailyHiddenNeedHits += scored.hiddenNeedHit ? 1 : 0;
          state.hiddenNeedHits += scored.hiddenNeedHit ? 1 : 0;
          state.streak = score >= 2 ? state.streak + 1 : 0;
          state.dailyBestStreak = Math.max(state.dailyBestStreak, state.streak);
          state.dailyEntries.push({ day: state.day, customerId: customer.id, customerName: customer.name, productIds: [...state.selectedProductIds], score, hiddenNeedHit: scored.hiddenNeedHit, eventId: state.currentEvent?.id, gameClock: state.gameClock, hasSynergy: scored.hasSynergy, volatile: scored.volatile });
          state.runReceipt.push(state.dailyEntries.at(-1));
        }
        state.lastFeedback = customer.response[scored.responseLevel];
        state.lastRoundResult = scored;
        state.receipt.push({
          customerName: customer.name,
          productIds: [...state.selectedProductIds],
          score
        });
        state.showFeedback = true;
        playTone(score >= 2 ? 640 : score === 1 ? 430 : 250, .12);
        render();
        customerPanel.querySelector('[data-action="continue"]')?.focus();
      });

      customerPanel.addEventListener("click", (event) => {
        const continueButton = event.target.closest('[data-action="continue"]');
        if (!continueButton || !state.showFeedback) return;
        state.showFeedback = false;
        state.customerIndex += 1;
        state.selectedProductIds = [];
        state.lastFeedback = null;
        state.lastRoundResult = null;
        if (state.mode === "roguelite" && state.customerIndex >= state.dailyCustomers.length) {
          state.screen = "settlement";
          state.trinketChoices = [];
        } else {
          state.screen = state.customerIndex >= currentCustomers().length ? "ending" : "game";
        }
        render();
        if (state.screen === "ending") {
          endingPanel.querySelector('[data-action="restart"]')?.focus({ preventScroll: true });
        } else if (state.screen === "settlement") {
          settlementPanel.querySelector('[data-action="continue-to-trinkets"]')?.focus({ preventScroll: true });
        } else {
          customerPanel.querySelector("#customer-name")?.focus();
        }
      });

      endingPanel.addEventListener("click", (event) => {
        if (event.target.closest('[data-action="restart"]')) resetGame();
      });

      document.addEventListener("visibilitychange", () => {
        if (ambienceGain && audioContext) {
          ambienceGain.gain.setTargetAtTime(document.hidden ? 0 : .018, audioContext.currentTime, .1);
        }
      });

      document.querySelector("[data-intro-art]").innerHTML = sceneArtwork(0, false, true);
      render();
    })();
  </script>
</body>
</html>
